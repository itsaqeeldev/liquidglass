[versions]
agp = "9.3.2"
android-compileSdk = "37"
android-compileSdkMinor = "1"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
composeMultiplatform = "1.12.2"
kotlin = "2.4.21"
material3 = "1.13.0-alpha02"
# liquidglass-material3 builds against the last stable Material 3, the one Compose Multiplatform 1.12.1
# pairs with (its compose.material3 accessor), so it never pulls an alpha Compose into an app.
material3Library = "1.9.0"
mavenPublish = "0.37.0"
coroutines = "1.11.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
# The sample only. The core library does not depend on material3; liquidglass-material3 uses the next.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material3-library = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3Library" }
# Icons for the demos and the Material renders (the last published material-icons-core).
# The back-gesture API Compose Multiplatform 1.12.1 already brings at runtime (it replaces BackHandler).
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version = "1.1.0" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version = "1.7.3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
