name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    # Fresh renderer verification took29m14s in run37674667084, before the new
    # original-density foreground case. Hosted runner speed varies about 2x: run 38512519316
    # took 36 min where unchanged classes (e.g. GlassTabBarV3GestureTest, 350 s against 183 s
    # in run 38461707949) ran about 1.9x slower. Leave execution/upload headroom; test
    # timeouts and optical tolerances are unchanged.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # Save the local task cache for trusted PR updates too. GitHub scopes it to this PR;
          # forked PRs remain read-only and cannot populate our build cache through this job.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Build library, Android sample and desktop; run production renderer tests
        # The Material 3 renders and the desktop showcase run in their own jobs (material3,
        # showcase), in parallel.
        # checkKotlinAbi: the public API of liquidglass and liquidglass-material3 equals its committed dump
        # (api/); changing it needs `./gradlew updateKotlinAbi` and a changelog entry.
        run: ./gradlew build checkKotlinAbi -x :liquidglass-material3:jvmTest -Patlas.skipShowcase=true --stacktrace
      - name: Upload test reports and rendered evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/atlas/**
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 14
  material3:
    runs-on: ubuntu-24.04
    # Nine phone-sized glass renders and interaction checks: about 12 min locally, 22 min on the
    # first hosted run (39147674357).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Material 3 glass components (renders and interaction)
        run: ./gradlew :liquidglass-material3:jvmTest --stacktrace
      - name: Upload Material 3 renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: material3-reports
          path: |
            liquidglass-material3/build/reports/**
            liquidglass-material3/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 14
  showcase:
    runs-on: ubuntu-24.04
    # The Material 3 showcase rendered on desktop at density 3, light and dark: about 6 min
    # locally. It took the build job past its limit when it ran there (run 39163768110).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Desktop showcase renders
        run: ./gradlew :desktop:desktopTest --tests "*MaterialShowcaseRenderTest*" --stacktrace
      - name: Upload showcase renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showcase-reports
          path: |
            apps/desktop/build/reports/**
            apps/desktop/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 14
  gradle-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Gradle plugin (codemod unit tests, TestKit builds)
        run: ./gradlew -p gradle-plugin test --stacktrace
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high


  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ports/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ports/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Install production Skia preview for browser integration tests
        run: npm ci --ignore-scripts --prefix ../skia
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: web-renderer-proof
          path: |
            ports/web/playwright-report/
            ports/web/test-results/
          retention-days: 14

  skia-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ports/skia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ports/skia/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run example
      - name: Verify native motion fixtures match the portable controller
        run: node ../dotnet/generate-motion-fixtures.mjs --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: skia-renderer-proof
          path: ports/skia/build/*.png
          if-no-files-found: ignore
          retention-days: 14

  web-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ports/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ports/npm/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Unit, provenance, vendored-file and type checks
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (element, both engines, interaction)
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: web-component-proof
          path: |
            ports/npm/playwright-report/
            ports/npm/test-results/
          if-no-files-found: ignore
          retention-days: 14

  react-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ports/react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ports/react-native/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Vendored painter, adapter against CanvasKit, components, types
        run: npm test
      - run: npm run example
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: react-native-proof
          path: ports/react-native/build/*.png
          if-no-files-found: ignore
          retention-days: 14

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ports/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generated shader and material fixture match their sources
        run: node tool/generate_shader.mjs --check && node tool/generate_fixture.mjs --check
      - name: The pubspec follows VERSION_NAME (set_version.py writes both)
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' ../../gradle.properties | tr -d '\r')
          grep -qx "version: ${version/-SNAPSHOT/-dev}" pubspec.yaml || { echo "::error::pubspec.yaml is not ${version/-SNAPSHOT/-dev}"; exit 1; }
      - name: Install Flutter 3.47.7 (stable)
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze; shader compiles and loads; uniforms equal the CanvasKit port's
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter analyze
          flutter test
          flutter pub publish --dry-run
          cd example && flutter pub get && flutter analyze

  qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ports/qt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generated shaders and GlassEffect.qml match the SkSL; the material equals the CanvasKit port's
        run: node tool/generate_shader.mjs --check && node --test test/material.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install PySide6, Xvfb and Mesa (software OpenGL)
        run: |
          python -m pip install --quiet PySide6==6.11.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 fonts-dejavu-core
      # qsb runs here, on Linux, and nowhere else: on Windows it opens a message box even for --help.
      - name: Compile the shaders with qsb (GLSL, HLSL, MSL)
        run: |
          cd LiquidGlass/shaders
          for s in liquidglass.vert liquidglass.frag; do
            pyside6-qsb --glsl "300 es,330" --hlsl 50 --msl 12 -o "$s.qsb" "$s" || exit 1
          done
          ls -l *.qsb
      - name: Render the example offscreen under Xvfb and check the glass's pixels
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: opengl
          QSG_RENDER_LOOP: basic
          LIBGL_ALWAYS_SOFTWARE: '1'
          QSG_INFO: '1'
        timeout-minutes: 8
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python examples/pyside/main.py --grab build/qt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: qt-proof
          path: |
            ports/qt/build/qt/*.png
            ports/qt/LiquidGlass/shaders/*.qsb
          if-no-files-found: ignore
          retention-days: 14

  unity:
    runs-on: windows-2025 # FXC (d3dcompiler_47) and Direct3D 11 WARP ship with Windows; Unity is not used
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    defaults:
      run:
        shell: bash
        working-directory: ports/unity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Generated HLSL, uniform list and .meta files are current; package.json follows VERSION_NAME
        run: |
          node tool/generate_shader.mjs --check
          node tool/write_meta.mjs --check
          version=$(sed -n 's/^VERSION_NAME=//p' ../../gradle.properties | tr -d '\r')
          grep -q "\"version\": \"${version/-SNAPSHOT/-dev}\"" com.shayxo.liquidglass/package.json \
            || { echo "::error::package.json is not ${version/-SNAPSHOT/-dev}"; exit 1; }
      - name: Material against the shared fixture; FXC ps_5_0; render on D3D11 WARP and check the pixels
        run: |
          dotnet restore Checks/Checks.csproj --locked-mode
          dotnet run --project Checks --no-restore -c Release -- build/unity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: unity-proof
          path: ports/unity/build/unity/*.png
          if-no-files-found: ignore
          retention-days: 14

  maui:
    runs-on: windows-2025 # builds the Android and Windows targets; the Android SDK and a JDK are preinstalled
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the MAUI workloads (Android, Windows)
        run: dotnet workload install maui-android maui-windows
      - name: Build LiquidGlass.Maui (net10.0, Android, Windows) and the Android demo app
        shell: bash
        run: |
          dotnet restore ports/dotnet/MauiDemo/MauiDemo.csproj --locked-mode
          dotnet build ports/dotnet/LiquidGlass.Maui/LiquidGlass.Maui.csproj -c Release
          dotnet build ports/dotnet/MauiDemo/MauiDemo.csproj -c Release --no-restore
          ls ports/dotnet/MauiDemo/bin/Release/net10.0-android/*-Signed.apk
      - name: Pack LiquidGlass.Maui and check it (no iOS or Mac Catalyst assets)
        shell: bash
        run: |
          dotnet pack ports/dotnet/LiquidGlass.Skia/LiquidGlass.Skia.csproj -c Release -o ports/dotnet/artifacts/nuget
          dotnet pack ports/dotnet/LiquidGlass.Maui/LiquidGlass.Maui.csproj -c Release -o ports/dotnet/artifacts/nuget
          node ports/dotnet/check-packages.mjs ports/dotnet/artifacts/nuget --maui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maui-demo-apk
          path: ports/dotnet/MauiDemo/bin/Release/net10.0-android/*-Signed.apk
          retention-days: 14

  dotnet-port:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install Linux font provider and example font
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1 fonts-dejavu-core
      - run: dotnet restore ports/dotnet/Checks/Checks.csproj --locked-mode
      - run: dotnet build ports/dotnet/Checks/Checks.csproj --no-restore
      - run: dotnet ports/dotnet/Checks/bin/Debug/net8.0/Checks.dll ports/dotnet/artifacts
      - name: Build the Avalonia host and verify its glass headlessly
        shell: bash
        run: |
          dotnet restore ports/dotnet/AvaloniaDemo/AvaloniaDemo.csproj --locked-mode
          dotnet build ports/dotnet/AvaloniaDemo/AvaloniaDemo.csproj --no-restore
          dotnet ports/dotnet/AvaloniaDemo/bin/Debug/net8.0/AvaloniaDemo.dll ports/dotnet/artifacts/avalonia
      - name: Pack the NuGet packages (not published) and check their contents
        shell: bash
        run: |
          dotnet pack ports/dotnet/LiquidGlass.Skia/LiquidGlass.Skia.csproj -c Release -o ports/dotnet/artifacts/nuget
          dotnet pack ports/dotnet/LiquidGlass.Avalonia/LiquidGlass.Avalonia.csproj -c Release -o ports/dotnet/artifacts/nuget
          if [ "$RUNNER_OS" = "Windows" ]; then
            dotnet pack ports/dotnet/LiquidGlass.WinForms/LiquidGlass.WinForms.csproj -c Release -o ports/dotnet/artifacts/nuget
            dotnet pack ports/dotnet/LiquidGlass.Wpf/LiquidGlass.Wpf.csproj -c Release -o ports/dotnet/artifacts/nuget
            node ports/dotnet/check-packages.mjs ports/dotnet/artifacts/nuget --winforms --wpf --avalonia
          else
            node ports/dotnet/check-packages.mjs ports/dotnet/artifacts/nuget --avalonia
          fi
      - name: Build Windows Forms host
        if: runner.os == 'Windows'
        run: |
          dotnet restore ports/dotnet/WinFormsDemo/WinFormsDemo.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ports/dotnet/WinFormsDemo/WinFormsDemo.csproj --no-restore
      - name: Verify owned native control backdrops
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: dotnet ports/dotnet/WinFormsDemo/bin/Debug/net10.0-windows10.0.19041.0/WinFormsDemo.dll --controls --capture ports/dotnet/artifacts/controls
      - name: Build the WPF host and verify its glass offscreen
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: |
          dotnet restore ports/dotnet/WpfDemo/WpfDemo.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ports/dotnet/WpfDemo/WpfDemo.csproj --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet ports/dotnet/WpfDemo/bin/Debug/net10.0-windows10.0.19041.0/WpfDemo.dll --capture ports/dotnet/artifacts/wpf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dotnet-renderer-proof-${{ matrix.os }}
          path: ports/dotnet/artifacts/
          if-no-files-found: ignore
          retention-days: 14
